name: Build and Release ZeroX Boost APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: Build Signed Release APK
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ZeroX-Boost-Release.apk

      - name: Upload Release APK workflow artifact
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeroX-Boost-Release
          path: ZeroX-Boost-Release.apk

      - name: Publish Release APK to GitHub Releases
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ZeroX-Boost-Release.apk --clobber
          else
            gh release create "$TAG" ZeroX-Boost-Release.apk \
              --title "ZeroX Boost Release APK" \
              --notes "Signed release APK build for ZeroX Boost."
          fi

