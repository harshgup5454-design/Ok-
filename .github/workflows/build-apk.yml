name: Build and Release GAMEBOOST APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GAMEBOOST-Final-Debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAMEBOOST-Final-Debug
          path: GAMEBOOST-Final-Debug.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" GAMEBOOST-Final-Debug.apk --clobber
          else
            gh release create "$TAG" GAMEBOOST-Final-Debug.apk \
              --title "GAMEBOOST APK" \
              --notes "Direct APK download for GAMEBOOST."
          fi
